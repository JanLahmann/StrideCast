<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StrideCast Dashboard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<link rel="stylesheet" href="assets/app.css">
<style>
  body { display: grid; grid-template-rows: auto minmax(0, 1fr); }
  .dash { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: 1fr 1fr minmax(90px, .55fr); gap: 14px; padding: 14px; min-height: 0; }
  .tile { background: var(--panel); border-radius: 12px; padding: 14px 18px; display: grid; grid-template-rows: auto 1fr auto; container-type: size; min-height: 0; overflow: hidden; }
  .tile .num { font-size: min(52cqh, 34cqw); align-self: center; white-space: nowrap; }
  .tile .sub { font-size: 14px; color: var(--dim); min-height: 1.5em; }
  .chart { grid-column: 1 / -1; background: var(--panel); border-radius: 12px; padding: 10px 18px; display: grid; grid-template-rows: minmax(0, 1fr) auto; gap: 6px; min-height: 0; }
  .chart svg { width: 100%; height: 100%; display: block; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 22px; font-size: 13px; color: var(--dim); }
  .legend i { display: inline-block; width: 18px; height: 4px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }
  @media (max-width: 720px) {
    .dash { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: 1fr 1fr 1fr minmax(80px, .5fr); }
  }
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="./">StrideCast</a>
  <nav><a href="ride.html">Ride</a><a href="dashboard.html" aria-current="page">Dashboard</a></nav>
  <span class="status" data-status><i></i><b>Connecting…</b></span>
</header>
<main class="dash">
  <section class="tile power"><span class="lbl">Power</span><span class="num"><span data-k="power">–</span><span class="unit">W</span></span><span class="sub">target <span data-k="targetPower">–</span> W</span></section>
  <section class="tile cad"><span class="lbl">Cadence</span><span class="num"><span data-k="rpm">–</span><span class="unit">rpm</span></span><span class="sub"></span></section>
  <section class="tile hr"><span class="lbl">Heart rate</span><span class="num"><span data-k="hr">–</span><span class="unit">bpm</span></span><span class="sub"></span></section>
  <section class="tile speed"><span class="lbl">Speed</span><span class="num"><span data-k="speed">–</span><span class="unit">km/h</span></span><span class="sub"></span></section>
  <section class="tile speed"><span class="lbl">Distance</span><span class="num"><span data-k="distance">–</span><span class="unit">km</span></span><span class="sub"></span></section>
  <section class="tile speed"><span class="lbl">Time</span><span class="num" data-k="elapsed">–</span><span class="sub"><span data-k="energy">–</span> kJ</span></section>
  <section class="chart">
    <svg viewBox="0 0 600 100" preserveAspectRatio="none" aria-label="Power and heart rate, last 10 minutes">
      <line x1="0" y1="25" x2="600" y2="25" stroke="#22303C"/><line x1="0" y1="50" x2="600" y2="50" stroke="#22303C"/><line x1="0" y1="75" x2="600" y2="75" stroke="#22303C"/>
      <polyline id="powerLine" fill="none" stroke="#F5A524" stroke-width="2" vector-effect="non-scaling-stroke" points=""/>
      <polyline id="hrLine" fill="none" stroke="#F2506E" stroke-width="2" vector-effect="non-scaling-stroke" points=""/>
    </svg>
    <div class="legend">
      <span><i style="background:var(--c-power)"></i>Power, 0–200 W</span>
      <span><i style="background:var(--c-hr)"></i>Heart rate, 40–200 bpm</span>
      <span>last 10 min</span>
    </div>
  </section>
</main>
<script type="module">
  import { startLive } from './assets/live.js';

  const WINDOW = 600; // seconds shown, one sample per second
  const history = [];
  const powerLine = document.getElementById('powerLine');
  const hrLine = document.getElementById('hrLine');

  // Maps a value in [lo, hi] to the chart's 0..100 height, top is high.
  const y = (v, lo, hi) => (100 - (Math.min(hi, Math.max(lo, v)) - lo) / (hi - lo) * 100).toFixed(1);
  const points = (key, lo, hi) => {
    const offset = WINDOW - history.length;
    return history.map((d, i) => `${offset + i},${y(d[key], lo, hi)}`).join(' ');
  };

  startLive((data) => {
    history.push(data);
    if (history.length > WINDOW) history.shift();
    powerLine.setAttribute('points', points('power', 0, 200));
    hrLine.setAttribute('points', points('hr', 40, 200));
  });
</script>
</body>
</html>
